http_port 3128

# Domains the agent may reach (leading dot includes subdomains).
acl allowed dstdomain .anthropic.com .claude.ai .claude.com
acl allowed dstdomain .github.com .githubusercontent.com
acl allowed dstdomain .npmjs.org .npmjs.com .yarnpkg.com
acl allowed dstdomain .pypi.org .pythonhosted.org
acl allowed dstdomain .wikipedia.org .stackoverflow.com .stackexchange.com
acl allowed dstdomain .mozilla.org .python.org .readthedocs.io .nodejs.org

# Want the open web? Replace "http_access allow allowed" with: http_access allow all

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
